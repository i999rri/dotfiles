# Starship config — tmux2k Asiimov-inspired (slanted, orange accent).
# Reference: https://starship.rs/config/

add_newline = false

format = """\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

# Hide username and hostname (even on SSH).
[username]
disabled = true

[hostname]
disabled = true

[fill]
symbol = ' '

[directory]
style = "bg:#ff6b35 fg:#1e1e1e bold"
format = "[ $path ]($style)[](fg:#ff6b35)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#3f3f4f fg:#e0e0e0"
format = "[](fg:#3f3f4f)[ $symbol$branch ]($style)"

[git_status]
style = "bg:#3f3f4f fg:#ff6b35 bold"
format = "[$all_status$ahead_behind ]($style)[](fg:#3f3f4f)"
modified = "!"
staged = "+"
untracked = "?"
deleted = "✘"
renamed = "»"
stashed = "$"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""

[cmd_duration]
min_time = 2_000
style = "fg:#ffaa55"
format = "[took $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "bg:#ff6b35 fg:#1e1e1e bold"
format = "[](fg:#ff6b35)[ $time ]($style)"

[character]
success_symbol = "[~/](bold fg:#ff6b35) "
error_symbol = "[~/](bold fg:red) "
vimcmd_symbol = "[~/](bold fg:#ff6b35) "